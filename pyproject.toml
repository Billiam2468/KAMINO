[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kneemeasure"
dynamic = ["version"]
description = "Automated knee MRI measurements (KRA, TT-TG, PTLTR, TTL, LTI, bump height, CDI) from labeled segmentations"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pynrrd>=1.0",
    "opencv-python-headless>=4.8",
    "matplotlib>=3.7",
]

[project.scripts]
kneemeasure = "kneemeasure.cli:main"

[tool.setuptools]
packages = ["kneemeasure"]

[tool.setuptools.package-data]
kneemeasure = ["webapp/*.html"]

[tool.setuptools.dynamic]
version = {attr = "kneemeasure.__version__"}
