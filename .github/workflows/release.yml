name: Build the downloadable app

# Pushing a version tag (e.g. v0.2.0, matching kneemeasure.__version__) builds the
# Windows and Mac apps and attaches them to that GitHub release. "Run workflow" on
# the Actions tab builds them without releasing (download them from the run's
# artifacts). See "Releasing a new version" in docs/development.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest          # Apple Silicon (M1 and later)
            label: Mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Test
        run: python -m unittest discover -s tests

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python -c "import kneemeasure; print(kneemeasure.__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but kneemeasure/__init__.py says $v"; exit 1
          fi

      - name: Build
        run: pyinstaller --noconfirm packaging/KAMINO.spec

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/KAMINO -DestinationPath KAMINO-${{ matrix.label }}.zip

      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/KAMINO.app KAMINO-${{ matrix.label }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KAMINO-${{ matrix.label }}
          path: KAMINO-${{ matrix.label }}.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: KAMINO-${{ matrix.label }}.zip
